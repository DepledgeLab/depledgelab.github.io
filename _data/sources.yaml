- id: doi:10.1038/s41467-025-68230-1
  type: paper
  description: "**DRAP3R** (Direct Read and Analysis of RNA Polymerase III derived RNAs) is a custom nanopore direct RNA sequencing method and analysis framework that enables the specific and sensitive capture of nascent Pol III-derived RNAs (and a small subset of Pol II-derived ncRNAs)."
  date: 2026-01-06
  image: images/draper_fin.png
  buttons:
    - type: source
      link: https://github.com/DepledgeLab/DRAP3R
  tags:
    - Nanopore

- id: doi:10.1128/msystems.00505-24
  type: paper
  description: "**NAGATA** uses _Nanopore_ direct RNA sequencing reads aligned to a genome to produce a transcriptome annotation. **NAGATA** functions by parsing read alignments (sorted BAM files) to identify Transcription Units (TUs) by internally converting BAM into BED12 followed by numerically sorting 'start' and 'end' positions and then grouping alignments with similar 'start' and 'end' co-ordinates. This is performed on a row-by-row basis with a new TU defined only if the alignment co-ordinates of a given row differ from the previous row by greater than user-defined threshold (20 nt for transcription start sites (TSS), 50 nt for cleavage and polyadenylation sites (CPAS))."
  date: 2024-07-2
  image: images/nagata_fin.png
  buttons:
    - type: source
      link: https://github.com/DepledgeLab/NAGATA
  tags:
    - software
    - Nanopore
  repo: DepledgeLab/NAGATA

- id: doi:10.1093/bioinformatics/btac274
  type: paper
  description: "**DRUMMER** is designed to identify RNA modifications at nucleotide-level resolution on distinct transcript isoforms through the comparative analysis of basecall errors in _Nanopore_ direct RNA sequencing (DRS) datasets."
  date: 2022-04-15
  image: images/drummer_fin.png
  buttons:
    - type: source
      link: https://github.com/DepledgeLab/DRUMMER
  tags:
    - software
    - Nanopore
  repo: DepledgeLab/DRUMMER


